<!doctype html>
<html lang="en-IN" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rupiq — Know where your money goes</title>
  <meta name="description" content="Rupiq is a private, offline-friendly money tracker for everyday Indian households. Your data stays on your device.">
  <meta name="theme-color" content="#0F6B5C">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
</head>
<body>
  <div id="app" aria-live="off"><div class="boot">Loading Rupiq…</div></div>
  <div id="sheet-root"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
  <noscript><p style="padding:2rem">Rupiq needs JavaScript to run. Nothing is sent to any server — all your data stays on your device.</p></noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
